[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-vocals-studio"
version = "0.1.0"
description = "AI powered vocal studio with voice cloning capabilities"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "AGPL-3.0"}
keywords = ["audio", "voice-cloning", "rvc", "yourtts", "qwen3", "coqui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

# Core runtime dependencies (CPU only)
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
]

[project.optional-dependencies]
# Extras for each backend
# rvc optional backend disabled (requires faiss)
yourtts = []
qwen3 = ["transformers>=4.41.2,<5.0", "huggingface_hub"]
coqui = ["coqui-tts"]
# Optional GPU support (future)
gpu = ["torch==2.3.0+cu121"]
[tool.setuptools]
packages = ["ai_vocals_studio"]
