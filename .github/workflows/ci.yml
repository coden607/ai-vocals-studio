name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks Scan
        uses: zricethezav/gitleaks-action@v1.6.0
        with:
          config_path: .gitleaks.toml
          exit_code: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pytest numpy soundfile librosa scipy pydub requests
      - run: pytest -q test_speaker_identity.py
