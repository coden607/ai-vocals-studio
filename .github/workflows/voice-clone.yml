name: Voice Clone CI

on:
  push:
    branches: [voice-clone-integration]
  pull_request:
    branches: [voice-clone-integration]

jobs:
  test-voice-clone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          # Install optional extras for all backends
          pip install -e .[rvc,yourtts,qwen3,coqui]
          # Additional runtime deps
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub
          pip install infer_rvc_python
      - name: Download models
        run: |
          source venv/bin/activate
          python scripts/download_voice_models.py
      - name: Run sanity test
        run: |
          source venv/bin/activate
          python scripts/test_voice_cloning.py
